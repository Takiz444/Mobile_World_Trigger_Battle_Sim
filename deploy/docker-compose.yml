# Production stack: the game server behind Caddy (automatic HTTPS
# certificates, WebSocket proxying), with one of two stores:
#
#   File store (default, simplest; one file per record on the trion-data volume):
#     docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
#   Postgres (TT_STORE=postgrest in deploy/.env, plus the postgres profile):
#     docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile postgres up -d --build
#
# deploy/bootstrap.sh does all of this on a fresh Ubuntu VM (see deploy/README.md).
#
# Browsers play at:  https://$TT_DOMAIN/          (Web client, served by Caddy)
# Native clients use: Server URL  https://$TT_DOMAIN
#                    live URL    wss://$TT_DOMAIN/live  (advertised by the server)
#
# The server holds live match state in memory, so run exactly one replica,
# even with Postgres. See docs/multiplayer/LAUNCH_PLAN.md ("Scaling path").

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    # Exits if its store is unreachable (e.g. Postgres still starting); retried.
    restart: unless-stopped
    environment:
      TT_PORT: "8080"
      TT_LIVE_PORT: "8081"
      TT_STORE: ${TT_STORE:-dir}
      TT_DATA_DIR: /data/store
      TT_DB_URL: http://postgrest:3000
      TT_DB_TOKEN: ${TT_DB_TOKEN:-}
      TT_TRUST_PROXY: "1"
      TT_TURN_TIMEOUT_SEC: ${TT_TURN_TIMEOUT_SEC:-43200}
      TT_PUBLIC_LIVE_URL: wss://${TT_DOMAIN}/live
      TT_ADMIN_KEY: ${TT_ADMIN_KEY:-}
    volumes:
      - trion-data:/data
    expose:
      - "8080"
      - "8081"
    # Least privilege: no extra capabilities, no privilege escalation, and a
    # memory ceiling so a runaway process can't take the host down.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  # Caddy with the exported Web client baked in (Dockerfile target "web").
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - server
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      TT_DOMAIN: ${TT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  db:
    profiles: [postgres]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: trion
      POSTGRES_USER: trion_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      PGRST_AUTHENTICATOR_PASSWORD: ${PGRST_AUTHENTICATOR_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trion_admin -d trion"]
      interval: 5s
      retries: 20

  # Internal only: no ports are published, so only the game server reaches it.
  postgrest:
    profiles: [postgres]
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      PGRST_DB_URI: postgres://authenticator:${PGRST_AUTHENTICATOR_PASSWORD}@db:5432/trion
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: game_server
      # Never serve the OpenAPI description of the store.
      PGRST_OPENAPI_MODE: disabled
    expose:
      - "3000"

volumes:
  trion-data:
  caddy-data:
  caddy-config:
  pg-data:

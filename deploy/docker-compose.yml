# Single-host production stack: the game server behind Caddy (automatic
# HTTPS certificates, WebSocket proxying).
#
#   cp deploy/.env.example deploy/.env    # then edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Clients then use:  Server URL  https://$TT_DOMAIN
#                    live URL    wss://$TT_DOMAIN/live  (advertised by the server)
#
# One server process holds all live state in memory, so run exactly one
# replica. See docs/multiplayer/LAUNCH_PLAN.md ("Scaling path") for the
# multi-instance design.

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      TT_PORT: "8080"
      TT_LIVE_PORT: "8081"
      TT_DATA_FILE: /data/matches.json
      TT_TURN_TIMEOUT_SEC: ${TT_TURN_TIMEOUT_SEC:-43200}
      TT_PUBLIC_LIVE_URL: wss://${TT_DOMAIN}/live
      TT_ADMIN_KEY: ${TT_ADMIN_KEY:-}
    volumes:
      - trion-data:/data
    expose:
      - "8080"
      - "8081"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - server
    environment:
      TT_DOMAIN: ${TT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  trion-data:
  caddy-data:
  caddy-config:
